apiVersion: batch/v1
kind: Job
metadata:
  name: eks-store-orders-migration
  namespace: eks-store
  labels:
    app.kubernetes.io/name: eks-store
    app.kubernetes.io/component: orders-migration
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eks-store
        app.kubernetes.io/component: orders-migration
    spec:
      serviceAccountName: order-service-sa
      restartPolicy: OnFailure
      containers:
        - name: orders-migration
          image: 407178840502.dkr.ecr.eu-north-1.amazonaws.com/eks-store-orders:latest
          imagePullPolicy: Always
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: order-db-sync-secret
                  key: DATABASE_URL
