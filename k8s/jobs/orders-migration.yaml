apiVersion: batch/v1
kind: Job
metadata:
  name: ${ORDERS_MIGRATION_JOB}
  namespace: eks-store
  labels:
    app.kubernetes.io/name: eks-store
    app.kubernetes.io/component: orders-migration
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eks-store
        app.kubernetes.io/component: orders-migration
    spec:
      serviceAccountName: order-service-sa
      restartPolicy: Never
      containers:
      - name: orders-migration
        image: ${ORDERS_IMAGE}
        imagePullPolicy: IfNotPresent
        command:
        - alembic
        - upgrade
        - head
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: eks-store-orders-db
              key: DATABASE_URL
        - name: PGSSLROOTCERT
          value: /app/certs/rds-ca.pem
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
