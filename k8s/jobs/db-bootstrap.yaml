apiVersion: batch/v1
kind: Job
metadata:
  name: ${BOOTSTRAP_JOB}
  namespace: eks-store
  labels:
    app.kubernetes.io/name: eks-store
    app.kubernetes.io/component: db-bootstrap
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eks-store
        app.kubernetes.io/component: db-bootstrap
    spec:
      serviceAccountName: db-job-sa
      restartPolicy: Never
      containers:
      - name: bootstrap-db
        image: ${SEED_IMAGE}
        imagePullPolicy: IfNotPresent
        command:
        - python
        - scripts/bootstrap_databases.py
        envFrom:
        - secretRef:
            name: eks-store-bootstrap-db-credentials
        env:
        - name: PGSSLROOTCERT
          value: /app/certs/rds-ca.pem
        - name: PGSSLMODE
          value: verify-full
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
