apiVersion: batch/v1
kind: Job
metadata:
  name: eks-store-catalog-seed
  namespace: eks-store
  labels:
    app.kubernetes.io/name: eks-store
    app.kubernetes.io/component: catalog-seed
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eks-store
        app.kubernetes.io/component: catalog-seed
    spec:
      serviceAccountName: catalog-service-sa
      restartPolicy: OnFailure
      containers:
        - name: catalog-seed
          image: 407178840502.dkr.ecr.eu-north-1.amazonaws.com/eks-store-seed:latest
          imagePullPolicy: Always
          command: ["python", "scripts/import_catalog.py"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: catalog-db-sync-secret
                  key: DATABASE_URL
