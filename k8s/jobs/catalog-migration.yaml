apiVersion: batch/v1
kind: Job
metadata:
  name: eks-store-catalog-migration
  namespace: eks-store
  labels:
    app.kubernetes.io/name: eks-store
    app.kubernetes.io/component: catalog-migration
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eks-store
        app.kubernetes.io/component: catalog-migration
    spec:
      serviceAccountName: db-job-sa
      restartPolicy: OnFailure
      containers:
        - name: catalog-migration
          image: 407178840502.dkr.ecr.eu-north-1.amazonaws.com/eks-store-catalog:latest
          imagePullPolicy: Always
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_SECRET_DIR
              value: "/mnt/secrets-store"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: catalog-db-sync-secret
                  key: DATABASE_URL
                  optional: true
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: eks-store-aws-secrets-catalog
