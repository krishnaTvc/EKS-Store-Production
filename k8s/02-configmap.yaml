apiVersion: v1
kind: ConfigMap
metadata:
  name: eks-store-config
  namespace: eks-store
  labels:
    app.kubernetes.io/name: eks-store
data:
  APP_ENV: ${ENVIRONMENT}
  AWS_REGION: ${AWS_REGION}
  S3_BUCKET_NAME: ${ASSETS_BUCKET}
  IMAGE_MODE: s3
  S3_PRESIGNED_EXPIRATION_SECONDS: '3600'
  CATALOG_SERVICE_URL: http://catalog-service:8001
  CATALOG_TIMEOUT_SECONDS: '5.0'
  CATALOG_LOG_LEVEL: INFO
  ORDER_LOG_LEVEL: INFO
  CATALOG_DB_POOL_SIZE: '2'
  CATALOG_DB_MAX_OVERFLOW: '1'
  ORDER_DB_POOL_SIZE: '2'
  ORDER_DB_MAX_OVERFLOW: '1'
  PGSSLROOTCERT: /app/certs/rds-ca.pem
