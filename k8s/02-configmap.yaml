apiVersion: v1
kind: ConfigMap
metadata:
  name: eks-store-config
  namespace: eks-store
  labels:
    app.kubernetes.io/name: eks-store
data:
  APP_ENV: "lab"
  AWS_REGION: "eu-north-1"
  S3_BUCKET_NAME: "eks-store-assets-lab-407178840502"
  IMAGE_MODE: "s3"
  S3_PRESIGNED_EXPIRATION_SECONDS: "3600"
  CATALOG_SERVICE_URL: "http://catalog-service:8001"
  CATALOG_TIMEOUT_SECONDS: "5.0"
  CATALOG_LOG_LEVEL: "INFO"
  ORDER_LOG_LEVEL: "INFO"
  CATALOG_DB_POOL_SIZE: "5"
  CATALOG_DB_MAX_OVERFLOW: "10"
  ORDER_DB_POOL_SIZE: "5"
  ORDER_DB_MAX_OVERFLOW: "10"
