apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: eks-store-aws-secrets-catalog
  namespace: eks-store
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "eks-store/lab/catalog-db"
        objectType: "secretsmanager"
        jmesPath:
          - path: "DATABASE_URL"
            objectAlias: "DATABASE_URL"
  secretObjects:
    - secretName: catalog-db-sync-secret
      type: Opaque
      data:
        - objectName: "DATABASE_URL"
          key: "DATABASE_URL"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: eks-store-aws-secrets-order
  namespace: eks-store
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "eks-store/lab/order-db"
        objectType: "secretsmanager"
        jmesPath:
          - path: "DATABASE_URL"
            objectAlias: "DATABASE_URL"
  secretObjects:
    - secretName: order-db-sync-secret
      type: Opaque
      data:
        - objectName: "DATABASE_URL"
          key: "DATABASE_URL"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: eks-store-aws-secrets-db-job
  namespace: eks-store
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "eks-store/lab/rds/master"
        objectType: "secretsmanager"
        jmesPath:
          - path: "host"
            objectAlias: "host"
          - path: "port"
            objectAlias: "port"
          - path: "master_username"
            objectAlias: "master_username"
          - path: "master_password"
            objectAlias: "master_password"
      - objectName: "eks-store/lab/catalog-db"
        objectType: "secretsmanager"
        jmesPath:
          - path: "password"
            objectAlias: "catalog_password"
      - objectName: "eks-store/lab/order-db"
        objectType: "secretsmanager"
        jmesPath:
          - path: "password"
            objectAlias: "order_password"
