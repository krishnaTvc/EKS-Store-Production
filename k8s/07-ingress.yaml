apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eks-store-ingress
  namespace: eks-store
  labels:
    app.kubernetes.io/name: eks-store
    environment: lab
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
