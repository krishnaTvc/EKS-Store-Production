apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog-service-sa
  namespace: eks-store
  labels:
    app.kubernetes.io/name: catalog-service
    app.kubernetes.io/component: catalog
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::407178840502:role/eks-store-catalog-sa-role-lab"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service-sa
  namespace: eks-store
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: orders
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::407178840502:role/eks-store-order-sa-role-lab"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: eks-store
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: frontend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-job-sa
  namespace: eks-store
  labels:
    app.kubernetes.io/name: eks-store
    app.kubernetes.io/component: database-jobs
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::407178840502:role/eks-store-db-job-sa-role-lab"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secrets-store-csi-driver-token-request
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secrets-store-csi-driver-token-request
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secrets-store-csi-driver-token-request
subjects:
  - kind: ServiceAccount
    name: secrets-store-csi-driver
    namespace: kube-system
