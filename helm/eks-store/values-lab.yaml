# Lab Environment Values - Cost-optimized for portfolio demonstrations
global:
  environment: lab

images:
  frontend:
    repository: 407178840502.dkr.ecr.eu-north-1.amazonaws.com/eks-store-frontend
  catalog:
    repository: 407178840502.dkr.ecr.eu-north-1.amazonaws.com/eks-store-catalog
  orders:
    repository: 407178840502.dkr.ecr.eu-north-1.amazonaws.com/eks-store-orders
  seed:
    repository: 407178840502.dkr.ecr.eu-north-1.amazonaws.com/eks-store-seed

aws:
  s3:
    assetsBucketName: eks-store-assets-lab-407178840502
  iamRoles:
    catalogRoleArn: "arn:aws:iam::407178840502:role/eks-store-catalog-sa-role-lab"
    orderRoleArn: "arn:aws:iam::407178840502:role/eks-store-order-sa-role-lab"
    dbJobRoleArn: "arn:aws:iam::407178840502:role/eks-store-db-job-sa-role-lab"

frontend:
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

catalog:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

orders:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

pdb:
  enabled: false  # Single replica lab does not require PDB

ingress:
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
