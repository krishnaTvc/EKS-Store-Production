# Default values for eks-store application chart.
global:
  environment: lab
  awsRegion: eu-north-1
  appName: eks-store

# ------------------------------------------------------------------------------
# Image Configuration
# ------------------------------------------------------------------------------
images:
  pullPolicy: IfNotPresent
  frontend:
    repository: eks-store-frontend
    tag: "latest"
  catalog:
    repository: eks-store-catalog
    tag: "latest"
  orders:
    repository: eks-store-orders
    tag: "latest"
  seed:
    repository: eks-store-seed
    tag: "latest"

# ------------------------------------------------------------------------------
# AWS Integration & Secrets Store CSI Configuration
# ------------------------------------------------------------------------------
aws:
  region: eu-north-1
  s3:
    assetsBucketName: eks-store-assets-lab
    imageMode: s3
    presignedExpirationSeconds: 3600
  secretsStore:
    enabled: true
    secretProviderClassName: "eks-store-aws-secrets"
    catalogSecretName: "eks-store/lab/catalog-db"
    orderSecretName: "eks-store/lab/order-db"
    rdsMasterSecretName: "eks-store/lab/rds/master"
  iamRoles:
    catalogRoleArn: ""
    orderRoleArn: ""
    dbJobRoleArn: ""

# ------------------------------------------------------------------------------
# Service Configurations
# ------------------------------------------------------------------------------
frontend:
  enabled: true
  replicaCount: 2
  containerPort: 8080
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

catalog:
  enabled: true
  replicaCount: 2
  containerPort: 8001
  service:
    type: ClusterIP
    port: 8001
  logLevel: INFO
  dbPoolSize: 2
  dbMaxOverflow: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

orders:
  enabled: true
  replicaCount: 2
  containerPort: 8002
  service:
    type: ClusterIP
    port: 8002
  logLevel: INFO
  dbPoolSize: 2
  dbMaxOverflow: 1
  catalogTimeoutSeconds: 5.0
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# ------------------------------------------------------------------------------
# Ingress (AWS ALB Ingress Controller)
# ------------------------------------------------------------------------------
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
          service:
            name: frontend
            port: 80
  tls:
    certificateArn: ""

# ------------------------------------------------------------------------------
# High Availability Policies
# ------------------------------------------------------------------------------
pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true

# ------------------------------------------------------------------------------
# Pre-Deploy Database Lifecycle Jobs
# ------------------------------------------------------------------------------
jobs:
  bootstrapDb:
    enabled: true
    ttlSecondsAfterFinished: 300
  catalogMigration:
    enabled: true
    ttlSecondsAfterFinished: 300
  ordersMigration:
    enabled: true
    ttlSecondsAfterFinished: 300
  catalogSeed:
    enabled: true
    ttlSecondsAfterFinished: 300
