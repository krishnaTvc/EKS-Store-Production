{{- if .Values.aws.secretsStore.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.aws.secretsStore.secretProviderClassName }}-catalog
  labels:
    {{- include "eks-store.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: {{ .Values.aws.secretsStore.catalogSecretName | quote }}
        objectType: "secretsmanager"
        jmesPath:
          - path: "DATABASE_URL"
            objectAlias: "DATABASE_URL"
          - path: "DATABASE_URL"
            objectAlias: "catalog_database_url"
  secretObjects:
    - secretName: catalog-db-sync-secret
      type: Opaque
      data:
        - objectName: "DATABASE_URL"
          key: "DATABASE_URL"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.aws.secretsStore.secretProviderClassName }}-order
  labels:
    {{- include "eks-store.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: {{ .Values.aws.secretsStore.orderSecretName | quote }}
        objectType: "secretsmanager"
        jmesPath:
          - path: "DATABASE_URL"
            objectAlias: "DATABASE_URL"
          - path: "DATABASE_URL"
            objectAlias: "order_database_url"
  secretObjects:
    - secretName: order-db-sync-secret
      type: Opaque
      data:
        - objectName: "DATABASE_URL"
          key: "DATABASE_URL"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.aws.secretsStore.secretProviderClassName }}-db-job
  labels:
    {{- include "eks-store.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: {{ .Values.aws.secretsStore.rdsMasterSecretName | quote }}
        objectType: "secretsmanager"
        jmesPath:
          - path: "host"
            objectAlias: "host"
          - path: "port"
            objectAlias: "port"
          - path: "master_username"
            objectAlias: "master_username"
          - path: "master_password"
            objectAlias: "master_password"
      - objectName: {{ .Values.aws.secretsStore.catalogSecretName | quote }}
        objectType: "secretsmanager"
        jmesPath:
          - path: "password"
            objectAlias: "catalog_password"
      - objectName: {{ .Values.aws.secretsStore.orderSecretName | quote }}
        objectType: "secretsmanager"
        jmesPath:
          - path: "password"
            objectAlias: "order_password"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.aws.secretsStore.secretProviderClassName }}
  labels:
    {{- include "eks-store.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: {{ .Values.aws.secretsStore.catalogSecretName | quote }}
        objectType: "secretsmanager"
        jmesPath:
          - path: "DATABASE_URL"
            objectAlias: "catalog_database_url"
      - objectName: {{ .Values.aws.secretsStore.orderSecretName | quote }}
        objectType: "secretsmanager"
        jmesPath:
          - path: "DATABASE_URL"
            objectAlias: "order_database_url"
  secretObjects:
    - secretName: catalog-db-sync-secret
      type: Opaque
      data:
        - objectName: "catalog_database_url"
          key: "DATABASE_URL"
    - secretName: order-db-sync-secret
      type: Opaque
      data:
        - objectName: "order_database_url"
          key: "DATABASE_URL"
{{- end }}
