{{- if .Values.jobs.catalogSeed.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "eks-store.fullname" . }}-catalog-seed-{{ randAlphaNum 5 | lower }}
  labels:
    {{- include "eks-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: catalog-seed
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "3"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: {{ .Values.jobs.catalogSeed.ttlSecondsAfterFinished }}
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/component: catalog-seed
    spec:
      serviceAccountName: db-job-sa
      restartPolicy: OnFailure
      containers:
        - name: catalog-seed
          image: "{{ .Values.images.seed.repository }}:{{ .Values.images.seed.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["python", "scripts/import_catalog.py"]
          env:
            - name: DATABASE_SECRET_DIR
              value: "/mnt/secrets-store"
            {{- if .Values.aws.secretsStore.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: catalog-db-sync-secret
                  key: DATABASE_URL
                  optional: true
            {{- end }}
          {{- if .Values.aws.secretsStore.enabled }}
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
          {{- end }}
      {{- if .Values.aws.secretsStore.enabled }}
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.aws.secretsStore.secretProviderClassName }}-catalog
      {{- end }}
{{- end }}
