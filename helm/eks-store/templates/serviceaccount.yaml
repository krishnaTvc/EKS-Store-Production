apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog-service-sa
  labels:
    {{- include "eks-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: catalog
  annotations:
    {{- if .Values.aws.iamRoles.catalogRoleArn }}
    eks.amazonaws.com/role-arn: {{ .Values.aws.iamRoles.catalogRoleArn | quote }}
    {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service-sa
  labels:
    {{- include "eks-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: orders
  annotations:
    {{- if .Values.aws.iamRoles.orderRoleArn }}
    eks.amazonaws.com/role-arn: {{ .Values.aws.iamRoles.orderRoleArn | quote }}
    {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  labels:
    {{- include "eks-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-job-sa
  labels:
    {{- include "eks-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: database-jobs
  annotations:
    {{- if .Values.aws.iamRoles.dbJobRoleArn }}
    eks.amazonaws.com/role-arn: {{ .Values.aws.iamRoles.dbJobRoleArn | quote }}
    {{- end }}
