apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog-service-sa
  labels:
    {{- include "eks-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: catalog
  {{- if .Values.aws.iamRoles.catalogRoleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.aws.iamRoles.catalogRoleArn | quote }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service-sa
  labels:
    {{- include "eks-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: orders
  {{- if .Values.aws.iamRoles.orderRoleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.aws.iamRoles.orderRoleArn | quote }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  labels:
    {{- include "eks-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-job-sa
  labels:
    {{- include "eks-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: database-jobs
  {{- if .Values.aws.iamRoles.dbJobRoleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.aws.iamRoles.dbJobRoleArn | quote }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secrets-store-csi-driver-token-request
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secrets-store-csi-driver-token-request
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secrets-store-csi-driver-token-request
subjects:
  - kind: ServiceAccount
    name: secrets-store-csi-driver
    namespace: kube-system
