apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    {{- include "eks-store.labels" . | nindent 4 }}
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: orders
spec:
  replicas: {{ .Values.orders.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
        app.kubernetes.io/component: orders
        environment: {{ .Values.global.environment }}
    spec:
      serviceAccountName: order-service-sa
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: {{ .Values.orders.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.orders.securityContext.runAsUser }}
      containers:
        - name: order-service
          image: "{{ .Values.images.orders.repository }}:{{ .Values.images.orders.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.orders.containerPort }}
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: {{ .Values.orders.securityContext.allowPrivilegeEscalation }}
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.orders.resources | nindent 12 }}
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: eks-store-config
                  key: APP_ENV
            - name: CATALOG_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: eks-store-config
                  key: CATALOG_SERVICE_URL
            - name: CATALOG_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: eks-store-config
                  key: CATALOG_TIMEOUT_SECONDS
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: eks-store-config
                  key: ORDER_LOG_LEVEL
            - name: DB_POOL_SIZE
              valueFrom:
                configMapKeyRef:
                  name: eks-store-config
                  key: ORDER_DB_POOL_SIZE
            - name: DB_MAX_OVERFLOW
              valueFrom:
                configMapKeyRef:
                  name: eks-store-config
                  key: ORDER_DB_MAX_OVERFLOW
            - name: DATABASE_SECRET_DIR
              value: "/mnt/secrets-store"
            {{- if .Values.aws.secretsStore.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: order-db-sync-secret
                  key: DATABASE_URL
                  optional: true
            {{- end }}
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          {{- if .Values.aws.secretsStore.enabled }}
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
          {{- end }}
      {{- if .Values.aws.secretsStore.enabled }}
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.aws.secretsStore.secretProviderClassName }}
      {{- end }}
