apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  labels:
    {{- include "eks-store.labels" . | nindent 4 }}
    app.kubernetes.io/name: catalog-service
    app.kubernetes.io/component: catalog
spec:
  type: {{ .Values.catalog.service.type }}
  ports:
    - port: {{ .Values.catalog.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: catalog-service
