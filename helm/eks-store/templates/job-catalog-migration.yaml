{{- if .Values.jobs.catalogMigration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "eks-store.fullname" . }}-catalog-migration-{{ randAlphaNum 5 | lower }}
  labels:
    {{- include "eks-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: catalog-migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: {{ .Values.jobs.catalogMigration.ttlSecondsAfterFinished }}
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/component: catalog-migration
    spec:
      serviceAccountName: db-job-sa
      restartPolicy: OnFailure
      containers:
        - name: catalog-migration
          image: "{{ .Values.images.catalog.repository }}:{{ .Values.images.catalog.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_SECRET_DIR
              value: "/mnt/secrets-store"
            {{- if .Values.aws.secretsStore.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: catalog-db-sync-secret
                  key: DATABASE_URL
                  optional: true
            {{- end }}
          {{- if .Values.aws.secretsStore.enabled }}
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
          {{- end }}
      {{- if .Values.aws.secretsStore.enabled }}
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.aws.secretsStore.secretProviderClassName }}
      {{- end }}
{{- end }}
