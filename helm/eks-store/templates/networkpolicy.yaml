{{- if .Values.networkPolicy.enabled }}
# 1. Ingress to Frontend: from ingress controller or within cluster
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-network-policy
  labels:
    {{- include "eks-store.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: catalog-service
      ports:
        - protocol: TCP
          port: 8001
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: order-service
      ports:
        - protocol: TCP
          port: 8002
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# 2. Ingress to Catalog Service: strictly from Frontend, Orders, and Pre-deploy Jobs
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: catalog-network-policy
  labels:
    {{- include "eks-store.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: catalog-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: order-service
      ports:
        - protocol: TCP
          port: 8001
  egress:
    # Allow DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow Egress to PostgreSQL Port 5432 and HTTPS to AWS S3
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
---
# 3. Ingress to Order Service: strictly from Frontend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order-network-policy
  labels:
    {{- include "eks-store.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: order-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
      ports:
        - protocol: TCP
          port: 8002
  egress:
    # Allow communication to catalog-service
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: catalog-service
      ports:
        - protocol: TCP
          port: 8001
    # Allow DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow PostgreSQL Port 5432 and HTTPS
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
{{- end }}
