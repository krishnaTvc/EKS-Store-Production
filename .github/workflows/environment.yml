name: Remove application (keep AWS infrastructure and data)
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [lab, production]
        default: lab
      confirmation:
        description: Type REMOVE-APP
        required: true
permissions:
  contents: read
concurrency:
  group: eks-store-operations
  cancel-in-progress: false
env:
  AWS_REGION: eu-north-1
  ENVIRONMENT: ${{ inputs.environment }}
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - run: bash scripts/install-kubectl.sh
      - env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = REMOVE-APP
          aws eks update-kubeconfig --region "$AWS_REGION" --name "eks-store-${ENVIRONMENT}"
          kubectl delete ingress eks-store-ingress -n eks-store --ignore-not-found --wait=true
          kubectl delete deployment frontend catalog-service order-service -n eks-store --ignore-not-found
          echo 'RDS, EKS, S3, ECR and NAT still exist and may incur charges.'
