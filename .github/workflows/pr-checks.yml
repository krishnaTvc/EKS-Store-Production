name: Pull Request Verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [bootstrap, network, data, platform, addons]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - run: terraform -chdir=infra/${{ matrix.stack }} init -backend=false -input=false
      - run: terraform -chdir=infra/${{ matrix.stack }} validate
