name: Pull Request Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - "catalog-service/**"
      - "order-service/**"
      - "frontend/**"
      - "scripts/**"
      - "config/**"
      - "data/**"
      - "helm/**"
      - "infra/**"
      - "tests/**"
      - "Dockerfile.seed"
      - "requirements.txt"
      - ".github/workflows/pr-checks.yml"

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Code Linting
        run: |
          flake8 catalog-service order-service scripts tests --max-line-length=140 --extend-ignore=E203,W503,F401

      - name: Run Pytest Suite
        run: |
          pytest -v

  helm-lint:
    name: Helm Chart Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.15.0"

      - name: Helm Lint
        run: |
          helm lint helm/eks-store

      - name: Helm Template Render Check
        run: |
          helm template test-check helm/eks-store --values helm/eks-store/values.yaml > rendered-default.yaml
          helm template test-lab helm/eks-store --values helm/eks-store/values-lab.yaml > rendered-lab.yaml
          helm template test-prod helm/eks-store --values helm/eks-store/values-production.yaml > rendered-prod.yaml
          echo "Rendered templates successfully."

  terraform-validate:
    name: Terraform Stacks Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [bootstrap, network, data, platform, addons]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Terraform Format Check
        run: |
          terraform fmt -check infra/${{ matrix.stack }}

      - name: Terraform Validate
        run: |
          cd infra/${{ matrix.stack }}
          terraform init -backend=false
          terraform validate
