name: Terraform Infrastructure Manager
on:
  workflow_dispatch:
    inputs:
      stack:
        type: choice
        options: [network, data, platform, addons, all]
        default: all
      action:
        type: choice
        options: [plan, apply, destroy]
        default: plan
      environment:
        type: choice
        options: [lab, production]
        default: lab
      confirmation:
        description: Type CONFIRM for destroy. Remove application ingress before teardown.
        required: false
permissions:
  contents: read
concurrency:
  group: eks-store-operations
  cancel-in-progress: false
env:
  AWS_REGION: eu-north-1
  ENVIRONMENT: ${{ inputs.environment }}
jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - name: Run requested stacks
        env:
          STACK: ${{ inputs.stack }}
          ACTION: ${{ inputs.action }}
          CONFIRM_DESTROY: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$STACK" != all ]]; then
            bash scripts/terraform-stack.sh "$STACK" "$ACTION"
          elif [[ "$ACTION" == destroy ]]; then
            for name in addons platform data network; do bash scripts/terraform-stack.sh "$name" "$ACTION"; done
          else
            for name in network data platform addons; do bash scripts/terraform-stack.sh "$name" "$ACTION"; done
          fi
