name: Deploy Production EKS Store
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'catalog-service/**'
      - 'order-service/**'
      - 'k8s/**'
      - 'scripts/**'
      - 'config/**'
      - 'data/**'
      - 'assets/**'
      - 'Dockerfile.seed'
      - 'requirements.txt'
      - '.github/**'
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [lab, production]
        default: lab
        required: true
permissions:
  contents: read
concurrency:
  group: eks-store-operations
  cancel-in-progress: false
env:
  AWS_REGION: eu-north-1
  ENVIRONMENT: ${{ inputs.environment || 'lab' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-master
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: PostgreSQL integration gate
        env:
          ALLOW_DISPOSABLE_DB_TEST: 'yes'
        run: python scripts/test_postgres_integration.py
  build:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - id: registry
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push SHA-tagged release images
        env:
          REGISTRY: ${{ steps.registry.outputs.registry }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          docker build -t "$REGISTRY/eks-store-frontend:$TAG" frontend
          docker build -t "$REGISTRY/eks-store-catalog:$TAG" catalog-service
          docker build -t "$REGISTRY/eks-store-orders:$TAG" order-service
          docker build -f Dockerfile.seed -t "$REGISTRY/eks-store-seed:$TAG" .
          for name in frontend catalog orders seed; do docker push "$REGISTRY/eks-store-$name:$TAG"; done
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install boto3 pyyaml httpx
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - run: bash scripts/install-kubectl.sh
      - name: Bootstrap, migrate, seed and rollout
        env:
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        run: bash scripts/deploy.sh
      - name: Upload catalog images
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          python scripts/upload_s3.py --bucket "eks-store-assets-${ENVIRONMENT}-${ACCOUNT}" --region "$AWS_REGION" --confirm
      - name: Live acceptance test (wait for healthy ALB targets)
        run: |
          set -euo pipefail
          for attempt in {1..40}; do
            HOST=$(kubectl get ingress eks-store-ingress -n eks-store -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [[ -n "$HOST" ]] && python scripts/smoke_test.py --url "http://$HOST"; then
              echo "Application verified: http://$HOST" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          exit 1
      - name: Capture failure evidence
        if: failure()
        run: bash scripts/diagnose.sh > deployment-diagnostics.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deployment-diagnostics
          path: deployment-diagnostics.txt
          retention-days: 7
