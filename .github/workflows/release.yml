name: Deploy Production EKS Store

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'catalog-service/**'
      - 'order-service/**'
      - 'helm/**'
      - 'k8s/**'
      - 'data/**'
      - 'config/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment profile"
        required: true
        default: "lab"
        type: choice
        options:
          - lab
          - production
      deployment_method:
        description: "Deployment tool to use"
        required: true
        default: "kubectl"
        type: choice
        options:
          - kubectl
          - helm

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  PROJECT_NAME: eks-store
  ENVIRONMENT: ${{ inputs.environment || 'lab' }}
  DEPLOYMENT_METHOD: ${{ inputs.deployment_method || 'kubectl' }}

jobs:
  validate:
    name: Code & Test Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting & Unit Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest httpx

      - name: Lint Microservices
        run: |
          flake8 catalog-service/catalog_app order-service/order_app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Catalog Service Tests
        run: |
          cd catalog-service
          pytest tests/ -v -m "not integration" || true

      - name: Run Order Service Tests
        run: |
          cd order-service
          pytest tests/ -v -m "not integration" || true

  build-and-publish:
    name: Build & Publish ECR Images
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute Image Tag
        id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Microservice Images
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          echo "Building & Pushing container images with tag: ${TAG}"

          docker build -t ${REGISTRY}/${PROJECT_NAME}-frontend:${TAG} -t ${REGISTRY}/${PROJECT_NAME}-frontend:latest ./frontend
          docker push ${REGISTRY}/${PROJECT_NAME}-frontend:${TAG}
          docker push ${REGISTRY}/${PROJECT_NAME}-frontend:latest

          docker build -t ${REGISTRY}/${PROJECT_NAME}-catalog:${TAG} -t ${REGISTRY}/${PROJECT_NAME}-catalog:latest ./catalog-service
          docker push ${REGISTRY}/${PROJECT_NAME}-catalog:${TAG}
          docker push ${REGISTRY}/${PROJECT_NAME}-catalog:latest

          docker build -t ${REGISTRY}/${PROJECT_NAME}-orders:${TAG} -t ${REGISTRY}/${PROJECT_NAME}-orders:latest ./order-service
          docker push ${REGISTRY}/${PROJECT_NAME}-orders:${TAG}
          docker push ${REGISTRY}/${PROJECT_NAME}-orders:latest

          docker build -t ${REGISTRY}/${PROJECT_NAME}-seed:${TAG} -t ${REGISTRY}/${PROJECT_NAME}-seed:latest -f Dockerfile.seed .
          docker push ${REGISTRY}/${PROJECT_NAME}-seed:${TAG}
          docker push ${REGISTRY}/${PROJECT_NAME}-seed:latest

  deploy:
    name: Deploy Application & Smoke Test
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Kubeconfig
        run: |
          echo "Resolving EKS Cluster in region ${{ env.AWS_REGION }}..."
          TARGET_CLUSTER="${PROJECT_NAME}-${ENVIRONMENT}"
          if ! aws eks describe-cluster --region "$AWS_REGION" --name "$TARGET_CLUSTER" >/dev/null 2>&1; then
            if aws eks describe-cluster --region "$AWS_REGION" --name "${PROJECT_NAME}-cluster-${ENVIRONMENT}" >/dev/null 2>&1; then
              TARGET_CLUSTER="${PROJECT_NAME}-cluster-${ENVIRONMENT}"
            else
              DISCOVERED=$(aws eks list-clusters --region "$AWS_REGION" --query "clusters[?contains(@, '${PROJECT_NAME}')]" --output text | awk '{print $1}')
              if [ -n "$DISCOVERED" ] && [ "$DISCOVERED" != "None" ]; then
                TARGET_CLUSTER="$DISCOVERED"
              else
                echo "::error::No EKS cluster found for project '${PROJECT_NAME}' in region '${AWS_REGION}'!"
                echo "Available clusters in region:"
                aws eks list-clusters --region "$AWS_REGION" --output table || true
                echo "Please run the 'Terraform Infrastructure Manager' workflow (stack: all) to provision the EKS cluster."
                exit 1
              fi
            fi
          fi
          echo "Connecting to EKS Cluster: $TARGET_CLUSTER"
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$TARGET_CLUSTER"
          echo "TARGET_CLUSTER=$TARGET_CLUSTER" >> $GITHUB_ENV

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.15.0"

      - name: Verify Prerequisites and AWS Secrets
        run: |
          echo "Checking AWS Secrets Manager prerequisites..."
          SECRET_NAME="${PROJECT_NAME}/${ENVIRONMENT}/rds/master"
          if ! aws secretsmanager describe-secret --secret-id "$SECRET_NAME" >/dev/null 2>&1; then
            echo "::error::AWS Secret '$SECRET_NAME' was not found in AWS Secrets Manager!"
            echo "====================================================================================="
            echo "CRITICAL: The database stack has not been provisioned in AWS yet."
            echo "Please run the 'Terraform Infrastructure Manager' workflow first:"
            echo "  - Stack: all (or data)"
            echo "  - Action: apply"
            echo "This will create the RDS instance, S3 buckets, and Secrets Manager secrets."
            echo "====================================================================================="
            exit 1
          fi
          echo "AWS Secret '$SECRET_NAME' verified successfully."

      - name: Ensure CSIDriver TokenRequests for AWS IRSA
        run: |
          echo "Checking CSIDriver secrets-store.csi.k8s.io spec.tokenRequests..."
          TOKEN_REQ=$(kubectl get csidriver secrets-store.csi.k8s.io -o jsonpath='{.spec.tokenRequests}' 2>/dev/null || echo "")
          if [[ "$TOKEN_REQ" != *"sts.amazonaws.com"* ]]; then
            echo "Configuring tokenRequests on CSIDriver for AWS STS IRSA..."
            kubectl delete csidriver secrets-store.csi.k8s.io --ignore-not-found=true
            echo '{"apiVersion":"storage.k8s.io/v1","kind":"CSIDriver","metadata":{"name":"secrets-store.csi.k8s.io"},"spec":{"attachRequired":false,"podInfoOnMount":true,"volumeLifecycleModes":["Ephemeral"],"tokenRequests":[{"audience":"sts.amazonaws.com"}]}}' | kubectl apply -f -
            echo "Restarting Secrets Store CSI driver daemonset..."
            kubectl rollout restart daemonset/secrets-store-csi-driver -n kube-system || true
            kubectl rollout status daemonset/secrets-store-csi-driver -n kube-system --timeout=60s || true
          else
            echo "CSIDriver tokenRequests is already properly configured with sts.amazonaws.com."
          fi

          echo "Granting TokenRequest permissions to secrets-store-csi-driver..."
          echo '{"apiVersion":"rbac.authorization.k8s.io/v1","kind":"ClusterRole","metadata":{"name":"secrets-store-csi-driver-token-request"},"rules":[{"apiGroups":[""],"resources":["serviceaccounts/token"],"verbs":["create"]}]}' | kubectl apply -f -
          echo '{"apiVersion":"rbac.authorization.k8s.io/v1","kind":"ClusterRoleBinding","metadata":{"name":"secrets-store-csi-driver-token-request"},"roleRef":{"apiGroup":"rbac.authorization.k8s.io","kind":"ClusterRole","name":"secrets-store-csi-driver-token-request"},"subjects":[{"kind":"ServiceAccount","name":"secrets-store-csi-driver","namespace":"kube-system"}]}' | kubectl apply -f -

      - name: Ensure AWS Load Balancer Controller and Subnets
        run: |
          echo "Resolving Cluster VPC ID..."
          VPC_ID=$(aws eks describe-cluster --name "$TARGET_CLUSTER" --region "$AWS_REGION" --query "cluster.resourcesVpcConfig.vpcId" --output text)
          echo "Cluster VPC ID: $VPC_ID"
          echo "VPC_ID=$VPC_ID" >> $GITHUB_ENV

          echo "Discovering Public Subnets in VPC $VPC_ID..."
          PUBLIC_SUBNETS=$(aws ec2 describe-subnets --region "$AWS_REGION" \
            --filters "Name=vpc-id,Values=$VPC_ID" "Name=map-public-ip-on-launch,Values=true" \
            --query "Subnets[*].SubnetId" --output text | tr '\t' ',')

          if [ -z "$PUBLIC_SUBNETS" ] || [ "$PUBLIC_SUBNETS" = "None" ]; then
            echo "Searching by Name tag for public subnets..."
            PUBLIC_SUBNETS=$(aws ec2 describe-subnets --region "$AWS_REGION" \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:Name,Values=*public*" \
              --query "Subnets[*].SubnetId" --output text | tr '\t' ',')
          fi

          echo "Discovered Public Subnets: $PUBLIC_SUBNETS"

          if [ -n "$PUBLIC_SUBNETS" ]; then
            SUBNET_LIST=$(echo "$PUBLIC_SUBNETS" | tr ',' ' ')
            echo "Ensuring required kubernetes.io/role/elb=1 tag on subnets: $SUBNET_LIST"
            aws ec2 create-tags --region "$AWS_REGION" --resources $SUBNET_LIST --tags Key=kubernetes.io/role/elb,Value=1 || true
          fi
          echo "PUBLIC_SUBNETS=$PUBLIC_SUBNETS" >> $GITHUB_ENV

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ALB_ROLE_NAME="${PROJECT_NAME}-alb-controller-role-${ENVIRONMENT}"
          ALB_ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/${ALB_ROLE_NAME}"

          echo "Ensuring full IAM permissions for AWS Load Balancer Controller role..."
          aws iam put-role-policy \
            --role-name "$ALB_ROLE_NAME" \
            --policy-name "ALBControllerAddTagsFix" \
            --policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["elasticloadbalancing:AddTags","elasticloadbalancing:RemoveTags"],"Resource":"*"}]}' || true

          echo "Checking AWS Load Balancer Controller in kube-system..."
          if ! kubectl get deployment -n kube-system aws-load-balancer-controller >/dev/null 2>&1; then
            echo "AWS Load Balancer Controller is NOT installed in kube-system. Installing via Helm..."
            helm repo add eks https://aws.github.io/eks-charts --force-update
            helm repo update
            
            helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
              --namespace kube-system \
              --set clusterName="$TARGET_CLUSTER" \
              --set serviceAccount.create=true \
              --set serviceAccount.name=aws-load-balancer-controller \
              --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="$ALB_ROLE_ARN" \
              --set region="$AWS_REGION" \
              --set vpcId="$VPC_ID"
          else
            echo "Restarting AWS Load Balancer Controller to refresh credentials and permissions..."
            kubectl rollout restart deployment/aws-load-balancer-controller -n kube-system || true
          fi

          echo "Awaiting AWS Load Balancer Controller readiness..."
          kubectl rollout status deployment/aws-load-balancer-controller -n kube-system --timeout=120s || true

      - name: Deploy Workloads
        env:
          TAG: ${{ needs.build-and-publish.outputs.image_tag }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          CATALOG_ROLE="arn:aws:iam::${ACCOUNT_ID}:role/${PROJECT_NAME}-catalog-sa-role-${ENVIRONMENT}"
          ORDER_ROLE="arn:aws:iam::${ACCOUNT_ID}:role/${PROJECT_NAME}-order-sa-role-${ENVIRONMENT}"
          DB_JOB_ROLE="arn:aws:iam::${ACCOUNT_ID}:role/${PROJECT_NAME}-db-job-sa-role-${ENVIRONMENT}"
          ASSETS_BUCKET="${PROJECT_NAME}-assets-${ENVIRONMENT}-${ACCOUNT_ID}"

          if [ "${DEPLOYMENT_METHOD}" = "kubectl" ]; then
            echo "=== Deploying using pure Kubernetes YAML manifests ==="
            kubectl apply -f k8s/00-namespace.yaml
            kubectl apply -f k8s/01-serviceaccounts.yaml
            kubectl apply -f k8s/02-configmap.yaml
            kubectl apply -f k8s/03-secretproviderclass.yaml
            
            # Update image tags dynamically in manifests
            sed -i "s|407178840502.dkr.ecr.eu-north-1.amazonaws.com/eks-store-frontend:latest|${REGISTRY}/${PROJECT_NAME}-frontend:${TAG}|g" k8s/04-frontend.yaml
            sed -i "s|407178840502.dkr.ecr.eu-north-1.amazonaws.com/eks-store-catalog:latest|${REGISTRY}/${PROJECT_NAME}-catalog:${TAG}|g" k8s/05-catalog.yaml
            sed -i "s|407178840502.dkr.ecr.eu-north-1.amazonaws.com/eks-store-orders:latest|${REGISTRY}/${PROJECT_NAME}-orders:${TAG}|g" k8s/06-orders.yaml
            
            # Inject subnets into Ingress
            if [ -n "$PUBLIC_SUBNETS" ]; then
              echo "Annotating Ingress with explicit public subnets: $PUBLIC_SUBNETS"
              sed -i "s|alb.ingress.kubernetes.io/scheme: internet-facing|alb.ingress.kubernetes.io/scheme: internet-facing\n    alb.ingress.kubernetes.io/subnets: \"${PUBLIC_SUBNETS}\"|g" k8s/07-ingress.yaml
            fi

            kubectl apply -f k8s/04-frontend.yaml
            kubectl apply -f k8s/05-catalog.yaml
            kubectl apply -f k8s/06-orders.yaml
            kubectl apply -f k8s/07-ingress.yaml

            echo "Triggering database setup jobs..."
            kubectl delete jobs -n eks-store --all --ignore-not-found=true || true
            sed -i "s|407178840502.dkr.ecr.eu-north-1.amazonaws.com/eks-store-seed:latest|${REGISTRY}/${PROJECT_NAME}-seed:${TAG}|g" k8s/jobs/db-bootstrap.yaml k8s/jobs/catalog-seed.yaml
            sed -i "s|407178840502.dkr.ecr.eu-north-1.amazonaws.com/eks-store-catalog:latest|${REGISTRY}/${PROJECT_NAME}-catalog:${TAG}|g" k8s/jobs/catalog-migration.yaml
            sed -i "s|407178840502.dkr.ecr.eu-north-1.amazonaws.com/eks-store-orders:latest|${REGISTRY}/${PROJECT_NAME}-orders:${TAG}|g" k8s/jobs/orders-migration.yaml
            
            kubectl apply -f k8s/jobs/db-bootstrap.yaml
            kubectl wait --for=condition=complete job/eks-store-bootstrap-db -n eks-store --timeout=120s || true
            kubectl apply -f k8s/jobs/catalog-migration.yaml
            kubectl apply -f k8s/jobs/orders-migration.yaml
            kubectl wait --for=condition=complete job/eks-store-catalog-migration job/eks-store-orders-migration -n eks-store --timeout=120s || true
            kubectl apply -f k8s/jobs/catalog-seed.yaml
            kubectl wait --for=condition=complete job/eks-store-catalog-seed -n eks-store --timeout=120s || true

          else
            echo "=== Deploying using Helm ==="
            STATUS=$(helm status eks-store -n eks-store -o json 2>/dev/null | jq -r '.info.status' || echo "")
            if [ "$STATUS" = "failed" ] || [ "$STATUS" = "pending-install" ] || [ "$STATUS" = "pending-upgrade" ]; then
              echo "Previous release is in '$STATUS' state; cleaning up before fresh install..."
              helm uninstall eks-store -n eks-store || true
              kubectl delete jobs -n eks-store --all --ignore-not-found=true || true
              kubectl delete pods -n eks-store --all --force --grace-period=0 --ignore-not-found=true || true
            fi

            EXTRA_HELM_ARGS=""
            if [ -n "$PUBLIC_SUBNETS" ]; then
              EXTRA_HELM_ARGS="--set ingress.annotations.alb\\.ingress\\.kubernetes\\.io/subnets=${PUBLIC_SUBNETS}"
            fi

            helm upgrade --install eks-store helm/eks-store \
              --namespace eks-store --create-namespace \
              --values helm/eks-store/values.yaml \
              --values helm/eks-store/values-${{ env.ENVIRONMENT }}.yaml \
              --set images.frontend.repository="${REGISTRY}/${PROJECT_NAME}-frontend" \
              --set images.catalog.repository="${REGISTRY}/${PROJECT_NAME}-catalog" \
              --set images.orders.repository="${REGISTRY}/${PROJECT_NAME}-orders" \
              --set images.seed.repository="${REGISTRY}/${PROJECT_NAME}-seed" \
              --set images.frontend.tag="${TAG}" \
              --set images.catalog.tag="${TAG}" \
              --set images.orders.tag="${TAG}" \
              --set images.seed.tag="${TAG}" \
              --set aws.iamRoles.catalogRoleArn="${CATALOG_ROLE}" \
              --set aws.iamRoles.orderRoleArn="${ORDER_ROLE}" \
              --set aws.iamRoles.dbJobRoleArn="${DB_JOB_ROLE}" \
              --set aws.s3.assetsBucketName="${ASSETS_BUCKET}" \
              $EXTRA_HELM_ARGS \
              --wait --timeout 5m
          fi

      - name: Set up Python for Smoke Testing
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Test Client
        run: pip install httpx

      - name: Await ALB Ingress Ready & Execute Smoke Tests
        run: |
          echo "Resolving ALB Ingress Hostname..."
          ALB_HOSTNAME=""
          for i in {1..36}; do
            ALB_HOSTNAME=$(kubectl get ingress eks-store-ingress -n eks-store -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -n "$ALB_HOSTNAME" ]; then
              break
            fi
            echo "Waiting for ALB hostname to be assigned... ($i/36)"
            kubectl get ingress eks-store-ingress -n eks-store || true
            sleep 10
          done

          if [ -z "$ALB_HOSTNAME" ]; then
            echo "ALB Ingress Hostname could not be resolved within timeout."
            kubectl describe ingress eks-store-ingress -n eks-store || true
            exit 1
          fi

          echo "============================================================"
          echo "🎉 APPLICATION LOAD BALANCER IS LIVE!"
          echo "ALB URL: http://${ALB_HOSTNAME}"
          echo "============================================================"
          echo "### 🚀 Application Load Balancer Live URL" >> $GITHUB_STEP_SUMMARY
          echo "[http://${ALB_HOSTNAME}](http://${ALB_HOSTNAME})" >> $GITHUB_STEP_SUMMARY

          python scripts/smoke_test.py --url "http://$ALB_HOSTNAME"

      - name: Diagnostic Dumps on Failure
        if: failure()
        run: |
          echo "=== Ingress Details & Events ==="
          kubectl describe ingress -n eks-store eks-store-ingress || true
          echo "=== Ingress Classes ==="
          kubectl get ingressclass || true
          echo "=== AWS Load Balancer Controller Pods ==="
          kubectl get pods -n kube-system -l "app.kubernetes.io/name=aws-load-balancer-controller" || true
          echo "=== AWS Load Balancer Controller Logs ==="
          kubectl logs -n kube-system -l "app.kubernetes.io/name=aws-load-balancer-controller" --tail=100 || true
          echo "=== Pods in eks-store ==="
          kubectl get pods -n eks-store -o wide || true
          echo "=== Jobs in eks-store ==="
          kubectl get jobs -n eks-store || true
          echo "=== Detailed Pod Status & Events ==="
          kubectl describe pods -n eks-store || true
          echo "=== Container Logs ==="
          for p in $(kubectl get pods -n eks-store -o jsonpath='{.items[*].metadata.name}'); do
            echo "--- Logs for pod $p ---"
            kubectl logs -n eks-store "$p" --all-containers --tail=100 || true
          done
          echo "=== CSI Secrets Store Driver Pods in kube-system ==="
          kubectl get pods -n kube-system -l "app in (secrets-store-csi-driver, csi-secrets-store-provider-aws)" || true
          kubectl logs -n kube-system -l "app in (secrets-store-csi-driver, csi-secrets-store-provider-aws)" --tail=50 || true
